<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审校问题清单</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#1a1d21; --ink2:#4a5159; --ink3:#7b838c;
  --line:#e3e6ea; --line2:#eef0f3;
  --s1:#c0392b; --s1bg:#fdecea; --s2:#b7791f; --s2bg:#fdf5e6;
  --s3:#4a6fa5; --s3bg:#eef3fa; --s4:#6b7280; --s4bg:#f1f2f4;
  --accent:#2c3e50;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65;
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:28px 24px 80px}
header.top{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px 28px;margin-bottom:18px}
header.top h1{margin:0 0 6px;font-size:22px}
header.top .sub{color:var(--ink3);font-size:13px}
.stage{display:inline-block;margin-top:10px;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:600}
.stage.interim{background:#fff6e0;color:#8a5a00;border:1px solid #f0dcae}
.stage.final{background:#eaf5ee;color:#2f7d4f;border:1px solid #cbe5d6}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 24px;margin-top:16px;
  padding-top:16px;border-top:1px solid var(--line2);font-size:13px}
.meta div span{display:block;color:var(--ink3);font-size:12px;margin-bottom:2px}
.meta div b{font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.kpi .n{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--ink3);margin-top:4px}
.kpi.s1 .n{color:var(--s1)} .kpi.s2 .n{color:var(--s2)}
.kpi.s3 .n{color:var(--s3)} .kpi.s4 .n{color:var(--s4)}
.toolbar{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .lbl{font-size:12px;color:var(--ink3);margin-right:2px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:999px;
  padding:5px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:#c9cfd6}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:6px 14px;font-size:13px;font-family:inherit;outline:none}
select.sel{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;
  font-size:13px;font-family:inherit;color:var(--ink2);cursor:pointer}
section.ch{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
section.ch>h2{margin:0;padding:14px 20px;font-size:15px;font-weight:600;border-bottom:1px solid var(--line2);
  display:flex;align-items:center;gap:10px;background:#fbfcfd}
section.ch>h2 .cnt{margin-left:auto;font-weight:400;font-size:12px;color:var(--ink3)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:#f7f9fa;text-align:left;font-weight:600;color:var(--ink2);font-size:12px;
  padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fcfdfe}
td.id{color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap;width:44px}
td.loc{min-width:120px;color:var(--ink2)}
td.quote{min-width:230px;max-width:330px;font-size:12.5px;background:#fafbfc;border-left:2px solid var(--line);padding-left:10px}
td.issue{min-width:250px;color:var(--ink2)}
td.fix{min-width:220px;color:var(--ink2)}
.sev{display:inline-block;padding:2px 9px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap}
.sev.s1{background:var(--s1bg);color:var(--s1)} .sev.s2{background:var(--s2bg);color:var(--s2)}
.sev.s3{background:var(--s3bg);color:var(--s3)} .sev.s4{background:var(--s4bg);color:var(--s4)}
.cat{display:inline-block;font-size:11.5px;color:var(--ink3);border:1px solid var(--line);
  border-radius:3px;padding:1px 6px;white-space:nowrap;background:#fbfcfd}
.flag{display:inline-block;margin-left:6px;font-size:11px;color:#8a5a00;background:#fff6e0;
  border:1px solid #f0dcae;border-radius:3px;padding:0 5px}
.ok{padding:18px 20px;color:#2f7d4f;background:#f2faf5;font-size:13px}
section.sum{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
section.sum>h2{margin:0;padding:16px 20px;font-size:15px;border-bottom:1px solid var(--line2);background:#fbfcfd}
.sum .body{padding:20px}
.bars{display:grid;gap:9px;margin-bottom:26px}
.bar{display:grid;grid-template-columns:170px 1fr 60px;align-items:center;gap:12px;font-size:13px}
.bar .track{height:16px;background:#f0f2f5;border-radius:3px;overflow:hidden}
.bar .fill{height:100%;border-radius:3px;background:var(--accent)}
.bar .num{text-align:right;color:var(--ink3);font-variant-numeric:tabular-nums}
h3.sec{font-size:14px;margin:26px 0 10px;padding-left:10px;border-left:3px solid var(--accent)}
h3.sec:first-child{margin-top:0}
.top3{display:grid;gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:#fcfdfe;display:flex;gap:14px}
.card .rank{font-size:22px;font-weight:700;color:#c9cfd6;line-height:1;flex:0 0 26px}
.card .t{font-weight:600;margin-bottom:3px}
.card .d{font-size:13px;color:var(--ink2)}
.card .w{font-size:12px;color:var(--s1);margin-top:5px}
.note{font-size:12.5px;color:var(--ink3);line-height:1.7;background:#fafbfc;border:1px dashed var(--line);
  border-radius:6px;padding:12px 14px;margin-top:12px}
footer{color:var(--ink3);font-size:12px;text-align:center;padding:24px 0 0}
@media print{
  body{background:#fff} .toolbar{display:none}
  section.ch,.sum,header.top{border-color:#ccc} tbody tr{break-inside:avoid}
  .wrap{max-width:none;padding:0}
}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <h1 id="h1">审校问题清单</h1>
  <div class="sub" id="sub"></div>
  <div id="stageBox"></div>
  <div class="meta" id="meta"></div>
</header>

<div class="kpis" id="kpis"></div>

<div class="toolbar">
  <span class="lbl">严重程度</span>
  <button class="btn on" data-sev="all">全部</button>
  <button class="btn" data-sev="严重">严重</button>
  <button class="btn" data-sev="中等">中等</button>
  <button class="btn" data-sev="轻微">轻微</button>
  <button class="btn" data-sev="待补">待补</button>
  <span class="lbl" style="margin-left:10px">章节</span>
  <select class="sel" id="chSel"><option value="all">全部章节</option></select>
  <input class="search" id="q" type="search" placeholder="搜索原文、说明、页码…">
</div>

<div id="chapters"></div>

<section class="sum">
  <h2>汇总统计与优先处理建议</h2>
  <div class="body">
    <h3 class="sec">一、各级数量与类型分布</h3>
    <div class="bars" id="sevBars"></div>
    <div class="bars" id="catBars"></div>

    <h3 class="sec">二、出现频率最高的类型</h3>
    <p style="margin:0 0 8px;font-size:13.5px" id="topCatLine">—</p>
    <div class="note" id="stageNote"></div>

    <h3 class="sec">三、待补资料清单（等客户提供后即可消除）</h3>
    <div class="tw"><table>
      <thead><tr><th style="width:44px">序号</th><th style="width:150px">原文位置</th>
      <th style="width:280px">待补内容</th><th>说明</th></tr></thead>
      <tbody id="pending"></tbody>
    </table></div>

    <h3 class="sec">四、最需优先处理的 3 个问题</h3>
    <div class="top3" id="top3"></div>

    <h3 class="sec">五、疑似问题清单（需人工复核，不建议直接改稿）</h3>
    <div class="tw"><table>
      <thead><tr><th style="width:44px">序号</th><th style="width:130px">原文位置</th>
      <th style="width:250px">原文摘录</th><th>存疑原因与复核建议</th></tr></thead>
      <tbody id="suspects"></tbody>
    </table></div>

    <h3 class="sec">六、验收标准自评</h3>
    <div class="tw"><table>
      <thead><tr><th style="width:44px">#</th><th style="width:46%">验收标准</th>
      <th style="width:70px">结论</th><th>说明</th></tr></thead>
      <tbody id="accept"></tbody>
    </table></div>
  </div>
</section>

<footer>本报告仅列问题与修改建议，未改动原文件；涉及具体数值的修改建议均标注"需人工确认"。</footer>
</div>

<script>
/* ===== 数据块 =====
   由 build.py 注入；也可手工编辑后直接打开本文件预览。
   字段: ch 章节 | sev 严重程度 | cat 问题类别 | loc 原文位置
         quote 原文摘录 | issue 问题说明 | fix 修改建议 | flag 可选标记
   sev 取 严重 / 中等 / 轻微 / 待补；待补 仅在 meta.stage = "interim" 时使用
   meta.emptyChapters 必须列出“未发现问题”的章节，否则该章不会出现在报告中
*/
const REPORT = /*BEGIN*/{
 "meta": {
  "title": "某某车型 使用说明书 · 审校问题清单",
  "file": "文件名.pdf",
  "pages": "142 页（正文 1–129）",
  "version": "2026 年 10 月 第一版",
  "date": "2026-10-29",
  "stage": "interim",
  "baseline": "无《术语表》《规格表》",
  "compare": "无外文原版",
  "emptyChapters": ["1. 车辆信息"]
 },
 "items": [
  {"ch":"5. 仪表和控制功能","sev":"待补","cat":"数据缺失（占位）","loc":"第 35 页 / 5.13","quote":"燃油储备量：　XXL","issue":"示例：燃油储备量未填，中途版待客户提供。","fix":"填入实测值。","flag":""},
  {"ch":"5. 仪表和控制功能","sev":"中等","cat":"文字差错","loc":"第 23 页 / 5.2.3","quote":"当检测到的电池电压小于 12.3V 或大 15V 时","issue":"示例：漏“于”字，阈值上限表述不清。","fix":"改为“或大于 15V”。","flag":""},
  {"ch":"8. 安全驾驶","sev":"严重","cat":"逻辑与内容矛盾","loc":"第 72 页 / 8.7","quote":"转向角度应尽量大，转向角度越小，翻车的可能性越大。","issue":"示例：与第 11 页“幅度过大或过快都可能导致翻车”相反。","fix":"改为“尽量减小转向角度”。","flag":""},
  {"ch":"9. 维护保养","sev":"轻微","cat":"术语与用语一致性","loc":"第 101 页 / 9.9","quote":"散热器风扇会根据散热器中冷却水的温度自动打开或关闭。","issue":"示例：全篇用“冷却液”，此处为“冷却水”。","fix":"改为“冷却液”。","flag":""}
 ],
 "top3": [
  {"t":"示例：第 12 章技术规格表整章空白","d":"两页除标题外无内容，用户无参数可查。","w":"影响：交付阻塞"},
  {"t":"示例：坡道驻车要求横置车身","d":"与第 3 章、8.8、8.9 三处要求相反。","w":"影响：安全隐患（翻车）"},
  {"t":"示例：转向角度结论与常识相反","d":"直接诱导危险操作。","w":"影响：安全隐患"}
 ],
 "suspects": [
  {"loc":"第 36 页 / 5.14.1","quote":"RON 辛烷值必须大于或等于 92","note":"示例：无规格表可核，需按目标市场燃油标号确认。"}
 ],
 "accept": [
  {"no":"1","crit":"逐章扫描，每章均给出结论（无问题章节注明“未发现问题”）","res":"达标","note":"示例。"},
  {"no":"2","crit":"每条问题均含原文摘录与可定位页码","res":"达标","note":"示例。"},
  {"no":"3","crit":"定级符合规则，存疑项已单列","res":"达标","note":"示例。"},
  {"no":"4","crit":"汇总齐全（数量/最高频/Top3/疑似）","res":"达标","note":"示例。"},
  {"no":"5","crit":"未改写原文、未臆断正确值","res":"达标","note":"示例。"},
  {"no":"6","crit":"全篇完整检查，未抽样","res":"存疑","note":"示例：插图内标注未能逐一验证。"},
  {"no":"7","crit":"版式类结论已目视复核","res":"达标","note":"示例。"}
 ]
}/*END*/;

const META = REPORT.meta, ITEMS = REPORT.items, TOP3 = REPORT.top3,
      SUSPECTS = REPORT.suspects, ACCEPT = REPORT.accept;

/* ===== 以下为渲染逻辑，一般不改 ===== */
const SEVCLS = {'严重':'s1','中等':'s2','轻微':'s3','待补':'s4'};
const ALL = ITEMS.map((it,i)=>Object.assign({no:i+1,flag:''}, it));
/* 所有进入 innerHTML 的动态字段须经 esc 转义，防止原文摘录中的 < > & 被当标签解析 */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

document.getElementById('h1').textContent = META.title;
document.getElementById('sub').textContent = '只报告问题与修改建议，不改写原文 · 按检查清单逐章扫描';
const isFinal = META.stage === 'final';
document.getElementById('stageBox').innerHTML =
  `<span class="stage ${isFinal?'final':'interim'}">${isFinal?'终稿':'中途版'}　${
    isFinal?'占位类问题按严重计':'占位类问题单列“待补”，不计入三级统计'}</span>`;

document.getElementById('meta').innerHTML = [
  ['受审文件', META.file], ['篇幅', META.pages], ['版本', META.version],
  ['审校日期', META.date], ['基准资料', META.baseline], ['对照版本', META.compare]
].map(([k,v])=>`<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');

const cnt = {严重:0,中等:0,轻微:0,待补:0};
ALL.forEach(o=>{ if(cnt[o.sev]!==undefined) cnt[o.sev]++; });
document.getElementById('kpis').innerHTML = `
  <div class="kpi s1"><div class="n">${cnt.严重}</div><div class="l">严重（安全 / 参数 / 逻辑）</div></div>
  <div class="kpi s2"><div class="n">${cnt.中等}</div><div class="l">中等（术语 / 歧义 / 引用）</div></div>
  <div class="kpi s3"><div class="n">${cnt.轻微}</div><div class="l">轻微（错别字 / 标点 / 格式）</div></div>
  <div class="kpi s4"><div class="n">${cnt.待补}</div><div class="l">待补（等资料，不计入三级）</div></div>
  <div class="kpi"><div class="n">${ALL.length}</div><div class="l">条目合计</div></div>`;

/* 章节下拉（按章节号数值排序，而非 items 出现顺序） */
const coll = new Intl.Collator('zh-CN', {numeric: true, sensitivity: 'base'});
const chs = [...new Set(ALL.map(o=>o.ch))].concat(META.emptyChapters||[]);
chs.sort((a,b)=>coll.compare(a,b));
const chSel = document.getElementById('chSel');
chs.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; chSel.appendChild(o); });

function render(){
  const sevF = document.querySelector('.btn.on').dataset.sev;
  const chF = chSel.value;
  const q = document.getElementById('q').value.trim().toLowerCase();
  let html = '';

  chs.forEach(ch=>{
    if(chF!=='all' && ch!==chF) return;
    const all = ALL.filter(o=>o.ch===ch);
    if(all.length===0){
      if(sevF!=='all' || q) return;
      html += `<section class="ch"><h2>${esc(ch)}<span class="cnt">未发现问题</span></h2>
        <div class="ok">✓ 未发现问题。本章与全篇在术语、单位、引用上一致。</div></section>`;
      return;
    }
    const rows = all.filter(o=>(sevF==='all'||o.sev===sevF)
      && (!q || (o.quote+o.issue+o.fix+o.loc+o.cat).toLowerCase().includes(q)));
    if(!rows.length) return;
    html += `<section class="ch"><h2>${esc(ch)}<span class="cnt">${rows.length} 条</span></h2>
      <div class="tw"><table><thead><tr>
      <th style="width:44px">序号</th><th style="width:66px">严重程度</th><th style="width:118px">问题类别</th>
      <th style="width:132px">原文位置</th><th style="width:250px">原文摘录</th>
      <th>问题说明</th><th style="width:240px">修改建议</th></tr></thead><tbody>`;
    rows.forEach(o=>{
      html += `<tr><td class="id">${o.no}</td>
        <td><span class="sev ${SEVCLS[o.sev]||'s3'}">${esc(o.sev)}</span></td>
        <td><span class="cat">${esc(o.cat)}</span></td>
        <td class="loc">${esc(o.loc)}</td>
        <td class="quote">${esc(o.quote)}${o.flag?`<span class="flag">${esc(o.flag)}</span>`:''}</td>
        <td class="issue">${esc(o.issue)}</td><td class="fix">${esc(o.fix)}</td></tr>`;
    });
    html += `</tbody></table></div></section>`;
  });
  document.getElementById('chapters').innerHTML = html || `<section class="ch"><div class="ok">当前筛选条件下无匹配条目。</div></section>`;
}

function bars(el, arr){
  const max = Math.max(...arr.map(a=>a[1]),1);
  el.innerHTML = arr.map(a=>`<div class="bar"><div>${esc(a[0])}</div>
    <div class="track"><div class="fill" style="width:${Math.max(a[1]/max*100,2)}%"></div></div>
    <div class="num">${a[1]}</div></div>`).join('');
}
bars(document.getElementById('sevBars'),
  [['严重',cnt.严重],['中等',cnt.中等],['轻微',cnt.轻微],['待补',cnt.待补]]);

const catMap = {};
ALL.forEach(o=>{ catMap[o.cat]=(catMap[o.cat]||0)+1; });
const catArr = Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
bars(document.getElementById('catBars'), catArr);
document.getElementById('topCatLine').innerHTML = catArr.length
  ? catArr.slice(0,3).map(a=>`<b>${esc(a[0])}</b> ${a[1]} 条（${(a[1]/ALL.length*100).toFixed(1)}%）`).join('　＞　') + '；其余类型依次递减。'
  : '—';

document.getElementById('stageNote').innerHTML = isFinal
  ? '本版为终稿：占位、空值、整章空白均按严重计。'
  : '本版为中途版：占位与空值共 <b>'+cnt.待补+'</b> 处，属客户尚未提供资料，已单列在第三节，不计入三级统计。'
    + '本版报告的重点应放在<b>不依赖资料即可修正</b>的问题上：术语、逻辑、交叉引用、安全表述、错别字。';

const pending = ALL.filter(o=>o.sev==='待补');
document.getElementById('pending').innerHTML = pending.length
  ? pending.map((o,i)=>`<tr><td class="id">B${i+1}</td><td class="loc">${esc(o.loc)}</td>
      <td class="quote">${esc(o.quote)}</td><td class="issue">${esc(o.issue)}</td></tr>`).join('')
  : `<tr><td colspan="4" style="color:#7b838c">无（终稿或资料已齐）</td></tr>`;

document.getElementById('top3').innerHTML = TOP3.map((c,i)=>`<div class="card">
  <div class="rank">${i+1}</div><div><div class="t">${esc(c.t)}</div>
  <div class="d">${esc(c.d)}</div><div class="w">${esc(c.w)}</div></div></div>`).join('');

document.getElementById('suspects').innerHTML = SUSPECTS.length
  ? SUSPECTS.map((s,i)=>`<tr><td class="id">S${i+1}</td><td class="loc">${esc(s.loc)}</td>
      <td class="quote">${esc(s.quote)}</td><td class="issue">${esc(s.note)}</td></tr>`).join('')
  : `<tr><td colspan="4" style="color:#7b838c">无</td></tr>`;

document.getElementById('accept').innerHTML = ACCEPT.map(a=>{
  const c = a.res==='达标' ? '#2f7d4f' : (a.res==='存疑' ? '#b7791f' : '#c0392b');
  return `<tr><td class="id">${esc(a.no)}</td><td>${esc(a.crit)}</td>
    <td><b style="color:${c}">${esc(a.res)}</b></td><td class="issue">${esc(a.note)}</td></tr>`;
}).join('');

document.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.btn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); render();
}));
chSel.addEventListener('change', render);
document.getElementById('q').addEventListener('input', render);
render();
</script>
</body>
</html>
